services:
  postgres:
    image: postgres:17 # Imagen oficial de PostgreSQL, versión 15
    container_name: postgres_microservices # Nombre del contenedor
    ports:
      - "5432:5432" # Expone el puerto de PostgreSQL
    environment:
      POSTGRES_USER: admin # Usuario predeterminado
      POSTGRES_PASSWORD: admin # Contraseña del usuario
      POSTGRES_DB: courses # Base de datos predeterminada

  mysql:
    image: mysql:9.2.0
    container_name: mysql_microservices
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: 'students'
      # So you don't have to use root, but you can if you like
      MYSQL_USER: 'admin'
      # You can use whatever password you like
      MYSQL_PASSWORD: 'admin'
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'admin'